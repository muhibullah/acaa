<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d5c63" />
<title>HomeLearn Kids — App Prototype</title>
<meta name="description" content="Clickable prototype of the HomeLearnBridge children's app. Concept for discussion." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Vazirmatn:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --teal: #0d5c63; --teal-deep: #083d44; --teal-soft: #e3f2ef;
  --coral: #f26b4f; --sun: #ffc857; --sand: #faf6ef; --ink: #12263a; --muted: #5d6b78;
  --green: #2bb673; --sky: #4d9de0; --purple: #8b6fd6; --pink: #ef6f9b;
  --card: #fff; --line: #ece5d8;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Nunito", "Vazirmatn", system-ui, sans-serif; color: var(--ink);
  background: linear-gradient(180deg, #e6f3fc, #cfe6f7);
  display: flex; flex-direction: column; height: 100%; overflow: hidden;
}
[dir="rtl"] body, body[dir="rtl"] { font-family: "Vazirmatn", "Nunito", system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

/* ---------- Prototype toolbar (outside the app) ---------- */
.proto-bar { flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap; color: var(--ink); }
.proto-name { font-weight: 900; font-size: .95rem; opacity: .9; }
.proto-name small { font-weight: 800; font-size: .7rem; background: var(--sun); color: var(--ink); padding: 3px 8px; border-radius: 99px; margin-inline-start: 6px; letter-spacing: .06em; }
.devices { display: flex; background: rgba(255,255,255,.75); box-shadow: 0 2px 10px rgba(30,80,120,.1); border-radius: 99px; padding: 4px; }
.devices button { color: var(--muted); font-weight: 800; padding: 8px 16px; border-radius: 99px; font-size: .9rem; }
.devices button.on { background: var(--teal); color: #fff; }

/* ---------- Stage + device frames ---------- */
.stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 8px 16px 20px; overflow: hidden; }
.scaler { position: relative; }
.device { position: absolute; top: 0; left: 0; transform-origin: top left; }
.device.phone { width: 390px; height: 800px; background: #0a1a24; border-radius: 52px; padding: 12px; box-shadow: 0 30px 70px rgba(30,80,120,.28); }
.device.phone::before { content: ""; position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 110px; height: 30px; background: #0a1a24; border-radius: 20px; z-index: 30; }
.device.tablet { width: 1180px; height: 820px; background: #0a1a24; border-radius: 44px; padding: 22px; box-shadow: 0 30px 70px rgba(30,80,120,.28); }
.device.tablet::before { content: ""; position: absolute; top: 50%; left: 8px; width: 7px; height: 7px; border-radius: 50%; background: #23384a; }
.device.tablet .app { border-radius: 24px; }
.device.laptop { width: 1360px; height: 900px; padding: 22px 22px 60px; background: #0a1a24; border-radius: 26px 26px 0 0; box-shadow: 0 30px 70px rgba(30,80,120,.28); }
.device.laptop::after { content: ""; position: absolute; left: -90px; right: -90px; bottom: -26px; height: 26px; background: linear-gradient(#c9d2da, #8e9aa5); border-radius: 0 0 26px 26px; }
.device.laptop::before { content: ""; position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); width: 7px; height: 7px; border-radius: 50%; background: #23384a; }
.device.laptop .app { border-radius: 8px; }
.window-bar { display: none; }
.device.laptop .window-bar { display: flex; align-items: center; gap: 8px; height: 38px; flex-shrink: 0; padding: 0 14px; background: #e9e4da; font-size: .8rem; font-weight: 700; color: var(--muted); direction: ltr; }
.window-bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff6b6b; }
.window-bar i:nth-child(2) { background: #ffc94d; } .window-bar i:nth-child(3) { background: #3ad29f; }
.window-bar span { margin: 0 auto; background: #fff; padding: 4px 40px; border-radius: 8px; }

/* ---------- Phone ---------- */
.app { position: relative; height: 100%; background: var(--sand); border-radius: 42px; overflow: hidden; display: flex; flex-direction: column; }

/* status + top bar */
.status { height: 50px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 6px; font-weight: 800; font-size: .85rem; direction: ltr; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 6px 16px 10px; flex-shrink: 0; }
.langs { display: flex; background: #fff; border-radius: 99px; padding: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.langs button { padding: 6px 11px; border-radius: 99px; font-weight: 800; font-size: .82rem; color: var(--muted); }
.langs button.on { background: var(--teal); color: #fff; }
.spacer { flex: 1; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 1.15rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); position: relative; }
.icon-btn.speaking { background: var(--coral); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.icon-btn .dot { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; background: var(--coral); border-radius: 50%; border: 2px solid #fff; }

/* screens */
.screens { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; scrollbar-width: none; }
.screens::-webkit-scrollbar { display: none; }
.screen { display: none; padding: 4px 16px 24px; animation: in .25s ease; }
.screen.on { display: block; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } }
h2 { font-size: 1.55rem; margin: 6px 0 4px; font-weight: 900; }
.sub { color: var(--muted); margin: 0 0 16px; font-weight: 600; }
.card { background: var(--card); border-radius: 22px; padding: 16px; box-shadow: 0 4px 16px rgba(13,92,99,.07); margin-bottom: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.big-emoji { font-size: 1.8rem; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; flex-shrink: 0; }
.label { font-size: .72rem; font-weight: 900; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin: 18px 4px 8px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-size: .75rem; font-weight: 800; }
.pill.ok { background: #dff5e9; color: #17804f; }
.pill.warn { background: #fff1d6; color: #9a6400; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 16px; font-weight: 900; font-size: 1rem; }
.btn.primary { background: var(--coral); color: #fff; box-shadow: 0 5px 0 #d4533a; }
.btn.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #d4533a; }
.btn.soft { background: var(--teal-soft); color: var(--teal); }
.btn.white { background: #fff; color: var(--teal); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border-radius: 20px; padding: 14px; color: #fff; text-align: start; min-height: 110px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
.tile:active { transform: translateY(2px); }
.tile .e { font-size: 2rem; }
.tile b { font-size: 1rem; line-height: 1.2; }

/* home */
.hero { background: linear-gradient(135deg, var(--teal), #13808a); color: #fff; border-radius: 26px; padding: 18px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -30px; bottom: -40px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,200,87,.25); }
.hero h2 { color: #fff; }
.hero .avatar { width: 54px; height: 54px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; font-size: 1.8rem; border: 3px solid #fff; flex-shrink: 0; }
.streak { display: flex; gap: 6px; margin-top: 14px; position: relative; z-index: 1; }
.streak span { flex: 1; text-align: center; background: rgba(255,255,255,.15); border-radius: 10px; padding: 6px 0; font-size: .72rem; font-weight: 800; }
.streak span.done { background: var(--sun); color: var(--ink); }
.task { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; }
.task .check { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); flex-shrink: 0; display: grid; place-items: center; color: #fff; font-weight: 900; }
.task.done .check { background: var(--green); border-color: var(--green); }
.task.done .t-title { text-decoration: line-through; color: var(--muted); }
.t-title { font-weight: 800; }
.chev { margin-inline-start: auto; color: var(--muted); font-size: 1.3rem; }
[dir="rtl"] .chev { transform: scaleX(-1); }
.offline { display: flex; align-items: center; gap: 10px; background: #fff; border: 2px dashed #b9ddd6; border-radius: 18px; padding: 12px 14px; font-weight: 700; font-size: .9rem; }

/* homework */
.steps { list-style: none; padding: 0; margin: 0; }
.steps li { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.steps li:last-child { border: 0; }
.steps .n { width: 32px; height: 32px; border-radius: 50%; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; font-weight: 900; flex-shrink: 0; }
.steps li.done .n { background: var(--green); color: #fff; }
.steps li.done p { color: var(--muted); }
.steps p { margin: 4px 0 0; font-weight: 700; }
.hint { background: #fff8e6; border-radius: 16px; padding: 12px 14px; font-weight: 700; margin-top: 10px; display: none; }
.hint.show { display: block; animation: in .25s; }
.progress { height: 12px; background: var(--teal-soft); border-radius: 99px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .4s; }
.photo-prev { margin-top: 10px; border-radius: 14px; max-height: 140px; display: none; }

/* chat */
.chat { display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-weight: 600; line-height: 1.4; }
.msg.them { background: #fff; align-self: flex-start; border-end-start-radius: 4px; }
.msg.me { background: var(--teal); color: #fff; align-self: flex-end; border-end-end-radius: 4px; }
.composer { display: flex; gap: 8px; margin-top: 12px; }
.composer input { flex: 1; border: 2px solid var(--line); border-radius: 99px; padding: 12px 16px; font: inherit; font-weight: 600; background: #fff; }
.composer button { width: 48px; border-radius: 50%; background: var(--coral); color: #fff; font-size: 1.2rem; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.quick button { background: #fff; border: 2px solid var(--line); border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: .85rem; }

/* learn */
.ages { display: flex; gap: 6px; margin-bottom: 14px; }
.ages button { flex: 1; padding: 10px 6px; border-radius: 14px; background: #fff; font-weight: 800; font-size: .85rem; }
.ages button.on { background: var(--ink); color: #fff; }

/* game */
.game { text-align: center; }
.eq { display: inline-flex; gap: 12px; align-items: center; background: var(--teal); color: #fff; font-size: 2.4rem; font-weight: 900; padding: 12px 22px; border-radius: 20px; direction: ltr; margin: 10px 0 20px; }
.slot { min-width: 64px; height: 58px; border-radius: 14px; background: var(--sun); color: var(--ink); display: grid; place-items: center; }
.answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; direction: ltr; }
.answers button { height: 64px; border-radius: 18px; color: #fff; font-size: 1.6rem; font-weight: 900; box-shadow: 0 5px 0 rgba(0,0,0,.18); }
.answers button.wrong { opacity: .35; }
.stars { font-size: 1.5rem; letter-spacing: 4px; margin: 6px 0; }
.feedback { min-height: 1.6em; font-weight: 900; font-size: 1.1rem; margin-top: 14px; }

/* breathe */
.breathe { width: 180px; height: 180px; margin: 20px auto; border-radius: 50%; background: radial-gradient(circle, #b8e3dc, var(--teal-soft)); display: grid; place-items: center; font-weight: 900; color: var(--teal); font-size: 1.2rem; transition: transform 4s ease-in-out; }
.breathe.big { transform: scale(1.35); }
.feelings { display: flex; justify-content: space-between; }
.feelings button { font-size: 2rem; width: 56px; height: 56px; border-radius: 16px; background: #fff; }
.feelings button.on { background: var(--sun); transform: scale(1.1); }

/* story */
.story-img { height: 150px; border-radius: 20px; background: linear-gradient(180deg, #a8dadc, #f1e3c6); display: grid; place-items: center; font-size: 4rem; margin-bottom: 14px; }
.story-text { font-size: 1.25rem; font-weight: 700; line-height: 1.7; }

/* progress */
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.badge { text-align: center; font-size: .7rem; font-weight: 800; color: var(--muted); }
.badge div { width: 56px; height: 56px; margin: 0 auto 4px; border-radius: 50%; display: grid; place-items: center; font-size: 1.6rem; background: var(--sun); box-shadow: 0 3px 0 #e0a93a; }
.badge.locked div { background: #eee; box-shadow: none; filter: grayscale(1); opacity: .5; }
.subject { margin: 12px 0; }
.subject .row { justify-content: space-between; font-weight: 800; margin-bottom: 6px; }
.subject .row > span:first-child { display: inline-flex; gap: 8px; }
.moves { background: linear-gradient(135deg, #fff1d6, #ffe3c9); }
.timeline { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: .75rem; font-weight: 800; }
.timeline span { background: #fff; border-radius: 10px; padding: 6px 8px; }
.timeline i { color: var(--coral); font-style: normal; }
.place { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.place:last-child { border: 0; }
.map { height: 140px; border-radius: 18px; margin-bottom: 12px; position: relative; overflow: hidden;
  background: linear-gradient(90deg, transparent 48%, #fff 48% 52%, transparent 52%), linear-gradient(0deg, transparent 58%, #fff 58% 62%, transparent 62%), linear-gradient(135deg, #dcefe9, #cfe6f2); }
.pin { position: absolute; font-size: 1.6rem; transform: translate(-50%, -100%); }

/* tab bar */
.tabbar { flex-shrink: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; padding: 8px 8px 22px; border-top: 1px solid var(--line); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .72rem; font-weight: 800; color: var(--muted); padding: 6px 2px; border-radius: 14px; }
.tabbar button .e { font-size: 1.45rem; filter: grayscale(.6); }
.tabbar button.on { color: var(--teal); background: var(--teal-soft); }
.tabbar button.on .e { filter: none; }

.back { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; color: var(--teal); padding: 6px 0; }
[dir="rtl"] .back .arr { transform: scaleX(-1); display: inline-block; }

.toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 99px; font-weight: 800; font-size: .9rem; opacity: 0; transition: .25s; pointer-events: none; white-space: nowrap; z-index: 20; }
.toast.show { opacity: 1; transform: translateX(-50%); }

/* ---------- Tablet layout ---------- */
.device.tablet .status { padding: 0 34px 6px; height: 40px; }
.device.tablet .topbar { padding: 8px 28px 14px; }
.device.tablet .screen { padding: 8px 28px 32px; }
.device.tablet h2 { font-size: 2rem; }
.device.tablet .hero { padding: 26px; }
.device.tablet .tasks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.device.tablet .tasks .card { margin: 0; min-height: 120px; display: flex; }
.device.tablet .tiles { grid-template-columns: repeat(4, 1fr); }
.device.tablet .tile { min-height: 150px; }
.device.tablet .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.device.tablet .pgrid .card { margin: 0; }
.device.tablet .answers { max-width: 520px; margin: 0 auto; }
.device.tablet .narrow { max-width: 620px; margin-inline: auto; }
.device.tablet .tabbar { padding: 10px 160px 14px; }
.device.tablet .tabbar button { flex-direction: row; justify-content: center; gap: 8px; font-size: .95rem; padding: 10px; }

/* ---------- Laptop layout: sidebar navigation ---------- */
.device.laptop .status { display: none; }
.device.laptop .app { display: grid; grid-template-columns: 230px 1fr; grid-template-rows: auto auto 1fr; }
.device.laptop .window-bar { grid-column: 1 / -1; }
.device.laptop .topbar { grid-column: 2; padding: 16px 36px 8px; }
.device.laptop .screens { grid-column: 2; grid-row: 3; }
.device.laptop .tabbar { grid-column: 1; grid-row: 2 / 4; display: flex; flex-direction: column; gap: 6px; padding: 20px 14px; border-top: 0; border-inline-end: 1px solid var(--line); }
.device.laptop .tabbar::before { content: "HomeLearn Kids"; font-weight: 900; color: var(--teal); font-size: 1.15rem; padding: 4px 12px 18px; }
.device.laptop .tabbar button { flex-direction: row; justify-content: flex-start; gap: 12px; font-size: 1rem; padding: 12px 14px; }
.device.laptop .screen { padding: 8px 36px 36px; max-width: 1040px; }
.device.laptop h2 { font-size: 2.1rem; }
.device.laptop .hero { padding: 28px; }
.device.laptop .tasks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.device.laptop .tasks .card { margin: 0; min-height: 110px; display: flex; }
.device.laptop .tiles { grid-template-columns: repeat(4, 1fr); }
.device.laptop .tile { min-height: 160px; }
.device.laptop .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.device.laptop .pgrid .card { margin: 0; }
.device.laptop .answers { max-width: 560px; margin: 0 auto; }
.device.laptop .narrow { max-width: 640px; }
.device.laptop .btn.primary, .device.laptop .btn.soft { max-width: 420px; }
.device.laptop .toast { bottom: 40px; }

/* ---------- Real phone: show the app full screen ---------- */
body.native .proto-bar { padding: 8px; gap: 8px; }
body.native .proto-name { display: none; }
body.native .devices button { padding: 6px 12px; font-size: .82rem; }
body.native .stage { padding: 0; place-items: stretch; }
body.native .scaler { width: 100% !important; height: 100% !important; }
body.native .device.phone { position: static; transform: none !important; width: 100%; height: 100%; padding: 0; border-radius: 0; box-shadow: none; }
body.native .device.phone::before { display: none; }
body.native .device.phone .app { border-radius: 0; }
body.native .device.phone .status { height: 10px; }
body.native .device.phone .status * { display: none; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="proto-bar">
  <span class="proto-name">HomeLearn Kids<small>PROTOTYPE</small></span>
  <div class="devices" role="group" aria-label="Screen type">
    <button data-device="phone" class="on">📱 Phone</button>
    <button data-device="tablet">📲 Tablet</button>
    <button data-device="laptop">💻 Laptop</button>
  </div>
</header>

<div class="stage" id="stage">
<div class="scaler" id="scaler">
<div class="device phone" id="device">
  <div class="app" id="app">
    <div class="window-bar"><i></i><i></i><i></i><span>HomeLearn Kids</span></div>
    <div class="status"><span>9:41</span><span>📶 🔋</span></div>

    <div class="topbar">
      <div class="langs" role="group" aria-label="Language">
        <button data-lang="en" class="on">EN</button>
        <button data-lang="fa">دری</button>
        <button data-lang="ps">پښتو</button>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="readBtn" aria-label="Read this page to me">🔊</button>
    </div>

    <div class="screens" id="screens">

      <!-- ============ HOME ============ -->
      <section class="screen on" data-screen="home" data-tab="home">
        <div class="hero">
          <div class="row">
            <div class="avatar">🧒</div>
            <div>
              <h2 data-t="hi"></h2>
              <div data-t="heroSub" style="opacity:.85;font-weight:700"></div>
            </div>
          </div>
          <div class="streak" id="streak"></div>
        </div>

        <div class="label" data-t="todayTasks"></div>
        <div class="tasks">
        <div class="card">
          <button class="task" data-go="homework-task"><span class="check"></span><span><span class="t-title" data-t="task1"></span><br/><span class="small muted" data-t="task1meta"></span></span><span class="chev">›</span></button>
        </div>
        <div class="card">
          <button class="task" data-go="story"><span class="check"></span><span><span class="t-title" data-t="task2"></span><br/><span class="small muted" data-t="task2meta"></span></span><span class="chev">›</span></button>
        </div>
        <div class="card">
          <button class="task" data-go="game"><span class="check"></span><span><span class="t-title" data-t="task3"></span><br/><span class="small muted" data-t="task3meta"></span></span><span class="chev">›</span></button>
        </div>
        </div>

        <button class="btn primary" id="readHome" style="margin-top:14px">🔊 <span data-t="readToMe"></span></button>

        <div class="label" data-t="savedLabel"></div>
        <div class="offline">✅ <span data-t="offlineNote"></span></div>
      </section>

      <!-- ============ HOMEWORK LIST ============ -->
      <section class="screen" data-screen="homework" data-tab="homework">
        <h2 data-t="hwTitle"></h2>
        <p class="sub" data-t="hwSub"></p>

let lang = "en";
let screen = "home";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const t = (k) => T[lang][k] ?? T.en[k];

function applyLang() {
  const rtl = lang !== "en";
  document.documentElement.lang = lang;
  $("#app").dir = rtl ? "rtl" : "ltr";
  $$("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
  $$(".langs button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
  $("#chatIn").placeholder = t("typeMsg");
  renderStreak(); renderSteps(); renderQuick();
}


function go(name) {
  stopSpeaking();
  screen = name;
  $$(".screen").forEach((s) => s.classList.toggle("on", s.dataset.screen === name));
  const tab = $(`.screen[data-screen="${name}"]`).dataset.tab;
  $$("[data-tabbtn]").forEach((b) => b.classList.toggle("on", b.dataset.tabbtn === tab));
  $("#screens").scrollTop = 0;
  if (name === "game") newRound();
  if (name === "chat" && !$("#chat").children.length) addMsg(t("c1"), "them");
}

function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.tm); toast.tm = setTimeout(() => el.classList.remove("show"), 2200);
}

// ---------- Home ----------
function renderStreak() {
  $("#streak").innerHTML = t("days").map((d, i) => `<span class="${i < 4 ? "done" : ""}">${i < 4 ? "🔥" : d}</span>`).join("");
}

// ---------- Homework steps ----------
const doneSteps = new Set();
function renderSteps() {
  $("#steps").innerHTML = ["s1", "s2", "s3"].map((k, i) => `
    <li class="${doneSteps.has(i) ? "done" : ""}"><button class="n" data-step="${i}" aria-label="Step ${i + 1}">${doneSteps.has(i) ? "✓" : i + 1}</button><p>${t(k)}</p></li>`).join("");
  $("#hwBar").style.width = `${(doneSteps.size / 3) * 100}%`;
}
$("#steps").addEventListener("click", (e) => {
  const b = e.target.closest("[data-step]"); if (!b) return;
  const i = +b.dataset.step; doneSteps.has(i) ? doneSteps.delete(i) : doneSteps.add(i);
  renderSteps();
  if (doneSteps.size === 3) { toast(t("great")[0]); $$(".task")[0].classList.add("done"); }
});
$("#hintBtn").addEventListener("click", () => $("#hint").classList.toggle("show"));
$("#photoIn").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  const img = $("#photoPrev"); img.src = URL.createObjectURL(f); img.style.display = "block";
  toast(t("photoSent"));
});

// ---------- Chat ----------
function addMsg(text, who) {
  const m = document.createElement("div"); m.className = `msg ${who}`; m.textContent = text;
  $("#chat").appendChild(m); m.scrollIntoView({ block: "end", behavior: "smooth" });
}
function renderQuick() {
  $("#quick").innerHTML = ["q1", "q2", "q3"].map((k, i) => `<button data-q="${i}">${t(k)}</button>`).join("");
}
function reply(i) { setTimeout(() => addMsg(t(["r1", "r2", "r3"][i] || "rDefault"), "them"), 900); }
$("#quick").addEventListener("click", (e) => {
  const b = e.target.closest("[data-q]"); if (!b) return;
  addMsg(b.textContent, "me"); reply(+b.dataset.q);
});
$("#composer").addEventListener("submit", (e) => {
  e.preventDefault(); const v = $("#chatIn").value.trim(); if (!v) return;
  addMsg(v, "me"); $("#chatIn").value = ""; reply(-1);
});

// ---------- Learn ----------
$("#ages").addEventListener("click", (e) => {
  const b = e.target.closest("[data-age]"); if (!b) return;
  $$("#ages button").forEach((x) => x.classList.toggle("on", x === b));
});

// ---------- Game ----------
const COLORS = ["#4d9de0", "#2bb673", "#f26b4f", "#8b6fd6", "#ef6f9b", "#0d5c63"];
let answer = 0, stars = 0;
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
function newRound() {
  const add = Math.random() < .5; let a, b, c;
  if (add) { a = rand(1, 9); b = rand(1, 9); c = a + b; } else { a = rand(5, 15); b = rand(1, a - 1); c = a - b; }
  answer = b; $("#ga").textContent = a; $("#gop").textContent = add ? "+" : "−"; $("#gc").textContent = c;
  $("#gslot").textContent = "?"; $("#gfeed").textContent = "";
  const start = Math.max(1, b - rand(0, 5));
  $("#ganswers").innerHTML = Array.from({ length: 6 }, (_, i) => `<button style="background:${COLORS[i]}" data-ans="${start + i}">${start + i}</button>`).join("");
  $("#stars").textContent = "★".repeat(stars) + "☆".repeat(5 - stars);
}
$("#ganswers").addEventListener("click", (e) => {
  const b = e.target.closest("[data-ans]"); if (!b || b.disabled) return;
  if (+b.dataset.ans === answer) {
    $("#gslot").textContent = answer; stars = Math.min(5, stars + 1);
    $("#stars").textContent = "★".repeat(stars) + "☆".repeat(5 - stars);
    const g = t("great"); $("#gfeed").textContent = g[rand(0, g.length - 1)];
    $$("#ganswers button").forEach((x) => (x.disabled = true));
    if (stars === 5) { $$(".task")[2].classList.add("done"); stars = 0; }
    setTimeout(newRound, 1100);
  } else { b.classList.add("wrong"); b.disabled = true; $("#gfeed").textContent = t("tryAgain"); }
});

// ---------- Calm ----------
$("#feelings").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  $$("#feelings button").forEach((x) => x.classList.toggle("on", x === b));
  const i = $$("#feelings button").indexOf(b);
  $("#feelMsg").textContent = i < 2 ? t("feelOk") : t("feelHard");
});
let breathTimer = null;
$("#breatheBtn").addEventListener("click", () => {
  const el = $("#breathe");
  if (breathTimer) { clearInterval(breathTimer); breathTimer = null; el.classList.remove("big"); el.textContent = t("breatheIn"); return; }
  let inhale = true;
  const step = () => { el.classList.toggle("big", inhale); el.textContent = t(inhale ? "breatheIn" : "breatheOut"); inhale = !inhale; };
  step(); breathTimer = setInterval(step, 4000);
});

// ---------- Read aloud ----------
const VOICE_LANG = { en: "en-GB", fa: "fa", ps: "ps" };
function stopSpeaking() { speechSynthesis?.cancel(); $("#readBtn").classList.remove("speaking"); }
function speak(text) {
  if (!("speechSynthesis" in window)) return toast(t("noVoice"));
  if (speechSynthesis.speaking) return stopSpeaking();
  const want = VOICE_LANG[lang];
  const voice = speechSynthesis.getVoices().find((v) => v.lang.toLowerCase().startsWith(want));
  if (!voice && lang !== "en") return toast(t("noVoice"));
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice; u.lang = voice ? voice.lang : "en-GB"; u.rate = .9;
  u.onend = () => $("#readBtn").classList.remove("speaking");
  $("#readBtn").classList.add("speaking");
  speechSynthesis.speak(u);
}
const screenText = () => $$(".screen.on [data-t], .screen.on .story-text")
  .filter((el) => el.offsetParent !== null).map((el) => el.textContent).join(". ");
$("#readBtn").addEventListener("click", () => speak(screenText()));
$("#readHome").addEventListener("click", () => speak(screenText()));
$("#readStory").addEventListener("click", () => speak(t("storyTitle") + ". " + t("storyText")));
speechSynthesis?.getVoices();

// ---------- Global clicks ----------
document.addEventListener("click", (e) => {
  const l = e.target.closest("[data-lang]"); if (l) { lang = l.dataset.lang; stopSpeaking(); applyLang(); return; }
  const g = e.target.closest("[data-go]"); if (g) { go(g.dataset.go); return; }
  const ts = e.target.closest("[data-toast]"); if (ts) { toast(t(ts.dataset.toast)); return; }
  const d = e.target.closest("[data-device]"); if (d) { setDevice(d.dataset.device); return; }
});

// ---------- Device switcher ----------
let device = "phone";
function setDevice(name) {
  device = name;
  $("#device").className = `device ${name}`;
  $$("[data-device]").forEach((b) => b.classList.toggle("on", b.dataset.device === name));
  try { localStorage.setItem("hlk-device", name); } catch (e) {}
  fit();
}
function fit() {
  const dev = $("#device"), sc = $("#scaler"), stage = $("#stage");
  const native = device === "phone" && innerWidth < 600;
  document.body.classList.toggle("native", native);
  if (native) { dev.style.transform = ""; return; }
  const w = dev.offsetWidth, h = dev.offsetHeight + (device === "laptop" ? 26 : 0);
  const cs = getComputedStyle(stage);
  const aw = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const pad = device === "laptop" ? 180 : 0; // room for the laptop base
  const k = Math.min(aw / (w + pad), ah / h, 1);
  dev.style.transform = `scale(${k})`;
  dev.style.left = `${(pad / 2) * k}px`;
  sc.style.width = `${(w + pad) * k}px`;
  sc.style.height = `${h * k}px`;
}
addEventListener("resize", fit);
try { const saved = localStorage.getItem("hlk-device"); if (saved) device = saved; } catch (e) {}

applyLang();
setDevice(device);
</script>
