<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAF4FF">
<title>HomeLearn Bridge — Kids App</title>
<meta name="description" content="Clickable prototype of the HomeLearn Bridge children's app in English, Dari and Pashto. Concept for discussion.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect x='2' y='2' width='116' height='116' rx='30' fill='%23FFF7E6'/%3E%3Ccircle cx='95' cy='24' r='10' fill='%23FFC83D'/%3E%3Cpath d='M18 56 L60 20 L102 56' fill='none' stroke='%232F6FED' stroke-width='11' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M60 60 C49 53 35 53 26 57 L26 87 C35 83 49 83 60 90 Z' fill='%23FF8A3D'/%3E%3Cpath d='M60 60 C71 53 85 53 94 57 L94 87 C85 83 71 83 60 90 Z' fill='%233CC37A'/%3E%3Cpath d='M20 106 Q60 84 100 106' fill='none' stroke='%238B5CF6' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&family=Vazirmatn:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2463EB;--blue-d:#1A4BC0;--blue-l:#E3EDFF;--green:#22A95B;--green-d:#178245;--green-l:#DFF5E7;
  --orange:#FF8A3D;--orange-l:#FFEBDC;--yellow:#FFC83D;--yellow-l:#FFF6D8;--purple:#7C4DEB;--purple-d:#5D33C4;--purple-l:#EEE7FF;
  --pink:#F0508A;--pink-l:#FFE4EE;--teal:#14A3B8;--teal-l:#DDF5F8;
  --ink:#16244A;--muted:#66708C;--line:#E3EAF5;--card:#FFFFFF;
  --bg1:#E4F0FF;--bg2:#F6FAFF;
  --font:"Nunito","Vazirmatn",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Baloo 2","Vazirmatn",system-ui,sans-serif;
}
[dir=rtl]{--font:"Vazirmatn","Nunito",system-ui,sans-serif;--display:"Vazirmatn","Baloo 2",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2) 60%);overflow:hidden}
button,input{font:inherit;color:inherit;border:none;background:none}
button{cursor:pointer}
h1,h2,h3,.disp{font-family:var(--display)}

/* ---------- layout ---------- */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px 28px;min-height:100%;display:flex;flex-direction:column}
.nav{order:2;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(22,36,74,.05)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px;border-radius:14px;font-size:12.5px;font-weight:800;color:#8D96AE;min-width:60px;position:relative}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--blue)}
.nav .badge-n{position:absolute;top:2px;inset-inline-end:12px;background:var(--pink);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.nav .brand{display:none}
body.nonav .nav{display:none}

/* tablet */
@media (min-width:700px){
  .wrap{max-width:820px;padding:24px 32px 36px}
  .nav button{font-size:14px;min-width:90px}
  .nav button svg{width:30px;height:30px}
}
/* laptop: sidebar */
@media (min-width:1100px){
  .app{flex-direction:row}
  .nav{order:0;flex-direction:column;justify-content:flex-start;gap:6px;width:240px;border-top:none;border-inline-end:1px solid var(--line);padding:24px 16px;box-shadow:none}
  .nav .brand{display:flex;align-items:center;gap:10px;margin:0 8px 22px}
  .nav .brand svg{width:52px;height:52px}
  .nav .brand b{font-family:var(--display);font-size:20px;line-height:1}
  .nav button{flex-direction:row;gap:14px;font-size:17px;padding:12px 16px;justify-content:flex-start}
  .nav button.on{background:var(--blue-l)}
  .nav .badge-n{position:static;margin-inline-start:auto}
  .wrap{max-width:1080px;padding:32px 44px 44px;zoom:1.12}
  .tile{min-height:200px}.tile .ic{font-size:70px}
}

/* ---------- common ---------- */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:48px}
.bar .ttl{flex:1;text-align:center}
.bar .ttl h2{font-size:24px;font-weight:800;line-height:1.15}
.bar .ttl small{display:block;font-size:15px;font-weight:700;color:var(--purple)}
.ibtn{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 2px 0 var(--line),0 4px 12px rgba(22,36,74,.06);flex:none;color:var(--ink)}
.ibtn svg{width:24px;height:24px}
.ibtn.snd{color:var(--blue)}
.ibtn.ghost{visibility:hidden}
[dir=rtl] .flip{transform:scaleX(-1)}
.card{background:var(--card);border-radius:24px;box-shadow:0 2px 0 var(--line),0 6px 18px rgba(22,36,74,.05)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:999px;font-family:var(--display);font-size:22px;font-weight:800;color:#fff;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);transition:transform .08s,opacity .2s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-d)}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.btn.purple{background:var(--purple);box-shadow:0 5px 0 var(--purple-d)}
.btn:disabled{opacity:.4;pointer-events:none}
.icb{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:30px;flex:none}
.c-blue{background:var(--blue-l)}.c-green{background:var(--green-l)}.c-orange{background:var(--orange-l)}.c-yellow{background:var(--yellow-l)}.c-purple{background:var(--purple-l)}.c-pink{background:var(--pink-l)}.c-teal{background:var(--teal-l)}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:18px;font-size:16px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sec{font-family:var(--display);font-size:20px;font-weight:800;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sec a{margin-inline-start:auto;font-family:var(--font);font-size:14px;color:var(--blue);font-weight:800}

/* list rows like the reference */
.rows{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:14px;text-align:start;width:100%;border:2px solid transparent}
.row:active{transform:scale(.99)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-family:var(--display);font-size:20px;line-height:1.15}
.row .tx small{display:block;font-size:14px;color:var(--muted);font-weight:700;line-height:1.3}
.row .chev{color:#A3ACC2;font-size:22px;font-weight:800}
.row.b-blue{border-color:#CFE0FF}.row.b-green{border-color:#C7EED6}.row.b-orange{border-color:#FFD9BD}.row.b-yellow{border-color:#FFE9A8}.row.b-purple{border-color:#DCCFFF}.row.b-pink{border-color:#FFCADD}.row.b-teal{border-color:#BDEBF1}
@media (min-width:1100px){.rows.two{grid-template-columns:1fr 1fr}}

/* ---------- splash ---------- */
#v-splash{background:linear-gradient(180deg,#CFE5FF 0%,#EAF4FF 50%,#D9F3E2 100%)}
#v-splash .wrap{align-items:center;justify-content:center;text-align:center;gap:6px;max-width:520px}
.logo-xl{width:132px;height:132px;filter:drop-shadow(0 10px 16px rgba(36,99,235,.25))}
.wm{font-family:var(--display);font-weight:800;line-height:.95;font-size:52px;letter-spacing:-.01em}
.wm .a{color:var(--blue)}.wm .b{background:linear-gradient(90deg,#FF8A3D,#F0508A 45%,#7C4DEB 75%,#22A95B);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag3{font-family:var(--display);font-size:22px;font-weight:700;color:var(--blue);display:flex;gap:10px;justify-content:center;align-items:center;margin-top:4px}
.tag3 i{width:7px;height:7px;border-radius:50%;background:var(--orange);display:inline-block}
.hero{position:relative;width:100%;height:200px;margin:8px 0}
.hero .hill{position:absolute;left:-40px;right:-40px;bottom:0;height:96px;background:#86D49F;border-radius:50% 50% 0 0}
.hero .hill2{position:absolute;left:30%;right:-60px;bottom:0;height:120px;background:#A3E0B5;border-radius:50% 50% 0 0}
.hero .kids{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;align-items:flex-end;font-size:clamp(56px,17vw,80px);line-height:1}
.hero .kids span{animation:bob 2.6s ease-in-out infinite}
.hero .kids .bk{font-size:46px;margin:0 -10px 4px;animation:none;z-index:2}
.hero .kids span:nth-child(3){animation-delay:.4s;font-size:1.15em}
.hero .kids span:nth-child(5){animation-delay:.8s}
@keyframes bob{50%{transform:translateY(-7px)}}
.hero .sun{position:absolute;top:6px;inset-inline-end:14%;font-size:44px}
.hero .cl{position:absolute;font-size:38px;top:20px;inset-inline-start:8%;opacity:.95}
.langs{display:flex;gap:8px;justify-content:center;margin:6px 0 16px}
.langs button{background:#fff;border-radius:999px;padding:9px 18px;font-size:18px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.langs button.on{background:var(--ink);color:#fff;box-shadow:0 3px 0 #0A1430}
.small{font-size:14px;font-weight:700;color:#3C6B50;margin-top:10px}

/* ---------- who ---------- */
.kids4{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (min-width:700px){.kids4{grid-template-columns:repeat(4,1fr)}}
.kid{padding:18px 8px 14px;text-align:center}
.kid .face{width:90px;height:90px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:52px}
.kid b{font-family:var(--display);font-size:22px;display:block;line-height:1.1}
.kid small{font-size:15px;color:var(--muted);font-weight:700}
.kid.add{background:transparent;border:3px dashed #B9C8E4;box-shadow:none;color:var(--muted)}
.kid.add .face{border:3px dashed #B9C8E4;font-size:40px}

/* ---------- home ---------- */
.hello{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.av{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:34px;border:3px solid #fff;box-shadow:0 3px 10px rgba(22,36,74,.12);flex:none}
.hello .tx{flex:1}
.hello h1{font-size:28px;font-weight:800;line-height:1.05}
.hello small{font-size:15px;color:var(--muted);font-weight:700}
.today{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--yellow-l);border:2px solid #FFE6A0}
.today .st{font-size:40px}
.today .tx{flex:1}
.today b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.today .dots{display:flex;gap:8px;margin-top:6px}
.today .dot{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:24px;position:relative}
.today .dot.done::after{content:"✓";position:absolute;inset-inline-end:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;border:2px solid #fff}
#cont .row{margin-top:14px}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.recs .rc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;text-align:center;border:2px solid #DCCFFF}
.recs .rc .ic{font-size:32px;line-height:1}
.recs .rc b{font-family:var(--display);font-size:15px;line-height:1.15}
.recs .rc small{font-size:12px;color:var(--muted);font-weight:700}
.vscreen{position:relative;aspect-ratio:16/9;width:100%;max-width:760px;margin:6px auto 0;border-radius:24px;background:#16244A;display:grid;place-items:center;font-size:72px;overflow:hidden}
.vcap{position:absolute;inset-inline:12px;bottom:12px;background:rgba(0,0,0,.7);color:#fff;font-size:17px;font-weight:700;line-height:1.35;padding:8px 12px;border-radius:12px;text-align:center}
.vbar{height:8px;width:100%;max-width:760px;background:#E3E8F3;border-radius:8px;margin:16px auto;overflow:hidden}
.vbar i{display:block;height:100%;width:0;background:var(--purple);transition:width .4s}
.vctl{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.vctl .btn{width:auto;padding:12px 30px}
.vctl .vp{padding:11px 16px;border-radius:14px;background:#fff;font-weight:800;font-size:15px;border:2px solid #DCCFFF;color:var(--muted)}
.vctl .vp.on{background:var(--purple-l);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{border-radius:26px;padding:18px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px solid transparent;min-height:168px;justify-content:center}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:60px;line-height:1.05}
.tile b{font-family:var(--display);font-size:23px;line-height:1}
.tile small{font-size:13.5px;font-weight:700;opacity:.75;line-height:1.25}
.t-blue{background:#E6EFFF;border-color:#CFE0FF;color:#1C4FC4}.t-green{background:#E3F7EA;border-color:#C7EED6;color:#167A40}.t-purple{background:#F0EAFF;border-color:#DCCFFF;color:#5A30C2}.t-orange{background:#FFF0E4;border-color:#FFD9BD;color:#B4511A}.t-yellow{background:#FFF7DC;border-color:#FFE9A8;color:#8A6300}.t-pink{background:#FFE9F1;border-color:#FFCADD;color:#B1255B}.t-teal{background:#E2F7FA;border-color:#BDEBF1;color:#0C7686}
.msgprev{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:16px;width:100%;text-align:start}
.msgprev .tx{flex:1;min-width:0}
.msgprev b{font-family:var(--display);font-size:18px;display:block}
.msgprev small{font-size:14px;color:var(--muted);font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-n{background:var(--pink);color:#fff;font-weight:800;font-size:14px;min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center}
@media (min-width:1100px){.homegrid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}.homegrid .tiles{grid-template-columns:repeat(2,1fr)}}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:#fff;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:800;color:var(--muted);box-shadow:0 2px 0 var(--line);display:flex;gap:6px;align-items:center}
.chips button.on{background:var(--blue);color:#fff;box-shadow:0 2px 0 var(--blue-d)}
.ages{display:flex;gap:8px;margin-bottom:14px}
.ages button{flex:1;background:#fff;border-radius:18px;padding:8px 4px;font-weight:800;font-size:15px;box-shadow:0 2px 0 var(--line);display:flex;align-items:center;justify-content:center;gap:6px}
.ages button.on{background:var(--ink);color:#fff}

/* ---------- activity ---------- */
#v-act{background:linear-gradient(180deg,#EDE5FF,#F7F3FF)}
#v-act .wrap{max-width:720px}
.qcard{padding:18px;text-align:center}
.qcard .q{font-family:var(--display);font-size:24px;font-weight:800;margin-bottom:12px;line-height:1.2}
.stage{border:2px solid var(--line);border-radius:22px;min-height:220px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;padding:16px}
.stage .it{font-size:58px;line-height:1.1;animation:pop .35s backwards}
.stage .letter{font-family:var(--display);font-size:140px;font-weight:800;color:var(--purple);line-height:1}
.stage .word{font-size:100px;line-height:1}
@keyframes pop{from{transform:scale(0)}}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{background:#fff;border:2px solid var(--line);border-radius:18px;min-height:76px;font-family:var(--display);font-size:34px;font-weight:800;display:grid;place-items:center;line-height:1;padding:6px}
.opt.small{font-size:24px}
.opt.ok{background:var(--green);border-color:var(--green);color:#fff}
.opt.no{background:var(--pink-l);border-color:#FFB3CC;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt svg{width:52px;height:52px}
.prog{display:flex;gap:6px;margin:0 0 14px}
.prog i{flex:1;height:10px;border-radius:10px;background:#fff}
.prog i.f{background:var(--yellow)}
.fbk{text-align:center;font-family:var(--display);font-size:22px;font-weight:800;height:40px;margin:12px 0 4px;opacity:0;transition:.2s}
.fbk.show{opacity:1}
.fbk.good{color:var(--green)}.fbk.try{color:var(--pink)}

/* ---------- reward ---------- */
#v-reward{background:radial-gradient(circle at 50% 25%,#FFFFFF 0%,#F2ECFF 60%,#E8DEFF 100%)}
#v-reward .wrap{align-items:center;text-align:center;max-width:560px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.starbig{width:170px;height:170px;margin-top:10px;animation:popstar .6s}
@keyframes popstar{from{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.12)}}
.ribbon{position:relative;background:var(--blue);color:#fff;font-family:var(--display);font-size:32px;font-weight:800;padding:4px 34px;border-radius:12px;margin-top:-26px;box-shadow:0 5px 0 var(--blue-d)}
.earned{font-family:var(--display);font-size:22px;font-weight:800;margin:14px 0}
.bdg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;padding:16px 10px}
@media (min-width:700px){.bdg.wide{grid-template-columns:repeat(6,1fr)}}
.bd{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:14px;line-height:1.2;text-align:center}
.bd .m{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:36px;border:5px solid #fff;box-shadow:0 0 0 3px currentColor,0 5px 10px rgba(0,0,0,.08);margin-bottom:8px}
.bd.lock{color:#B9C1D3!important}.bd.lock .m{background:#EEF1F7!important;filter:grayscale(1)}

/* ---------- progress ---------- */
.prof{display:flex;align-items:center;gap:14px;padding:16px}
.prof b{font-family:var(--display);font-size:26px;display:block;line-height:1}
.prof small{color:var(--muted);font-weight:700;font-size:15px}
.jar{display:flex;align-items:center;gap:14px;padding:16px;background:var(--yellow-l);border:2px solid #FFE6A0;margin-top:12px}
.jar .n{font-family:var(--display);font-size:32px;font-weight:800;line-height:1}
.meter{height:14px;background:#fff;border-radius:14px;overflow:hidden;margin:8px 0 4px}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:14px;transition:width .5s}
.jar small{font-size:13px;color:var(--muted);font-weight:700}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 10px}
@media (min-width:700px){.skills{grid-template-columns:repeat(6,1fr)}}
.sk{text-align:center;font-weight:800;font-size:14px;line-height:1.2}
.sk .m{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;margin:0 auto 6px}
.sk small{display:block;color:var(--muted);font-size:13px}
@media (min-width:1100px){.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}}

/* ---------- story ---------- */
#v-story{background:linear-gradient(180deg,#E2F1FF,#F6FBFF)}
#v-story .wrap{max-width:780px}
.page{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.scene{font-size:104px;line-height:1.1;width:100%;padding:30px 10px}
.sent{font-family:var(--display);font-size:27px;font-weight:700;line-height:1.35;max-width:600px}
.pager{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:16px}
.pdots{display:flex;gap:6px}.pdots i{width:12px;height:12px;border-radius:12px;background:#C6D4EA}.pdots i.on{width:30px;background:var(--blue)}

/* ---------- homework ---------- */
.school{text-align:center;padding:10px 0 4px}
.school .ill{font-size:78px;line-height:1.1}
.school p{font-weight:700;color:var(--muted);font-size:16px;max-width:360px;margin:6px auto 0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.step{padding:12px 4px;text-align:center;position:relative;border:2px solid transparent}
.step .ic{font-size:38px;line-height:1.1}
.step b{font-size:14px;display:block;font-weight:800}
.step.on{background:var(--green-l);border-color:#9EDFB7}
.step .ck{position:absolute;top:-8px;inset-inline-end:-6px;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:900;color:#fff}
.step.on .ck{background:var(--green);border-color:var(--green)}
.nbad{background:var(--pink);color:#fff;font-size:13px;font-weight:800;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center}

/* ---------- messages ---------- */
#v-chat .wrap{padding-bottom:0;max-width:760px}
.chatbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.chatbar .tx{flex:1}
.chatbar b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.chatbar small{font-size:13.5px;color:var(--green);font-weight:800}
.safe{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);background:#fff;border-radius:999px;padding:6px 12px;margin:0 auto 12px;width:max-content;max-width:100%}
.thread{flex:1;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px;overflow-y:auto}
.msg{max-width:78%;padding:10px 14px;border-radius:20px;font-size:17px;font-weight:700;line-height:1.35;animation:in .2s}
.msg.them{background:#fff;border-end-start-radius:6px;align-self:flex-start;box-shadow:0 2px 0 var(--line)}
.msg.me{background:var(--blue);color:#fff;border-end-end-radius:6px;align-self:flex-end}
.msg .tm{display:block;font-size:11.5px;opacity:.6;margin-top:2px}
.msg.voice{display:flex;align-items:center;gap:8px}
.msg.voice .wave{display:flex;gap:3px;align-items:center}
.msg.voice .wave i{width:4px;border-radius:4px;background:currentColor;opacity:.8}
.typing{align-self:flex-start;background:#fff;border-radius:20px;padding:12px 16px;display:none;gap:4px}
.typing.on{display:flex}
.typing i{width:8px;height:8px;border-radius:50%;background:#A3ACC2;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.quick{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;background:#fff;border:2px solid #CFE0FF;color:var(--blue);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:800}
.composer{display:flex;gap:8px;align-items:center;padding:8px 0 14px;position:sticky;bottom:0;background:linear-gradient(180deg,rgba(246,250,255,0),var(--bg2) 30%)}
.composer input{flex:1;background:#fff;border-radius:999px;padding:13px 18px;font-size:16px;font-weight:700;box-shadow:0 2px 0 var(--line);min-width:0;outline:none}
.composer .ibtn.mic{background:var(--green);color:#fff}
.composer .ibtn.send{background:var(--blue);color:#fff}
.composer .ibtn.rec{background:var(--pink);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

/* ---------- rewards ---------- */
.rw-jar{display:flex;align-items:center;gap:16px;padding:18px;background:linear-gradient(135deg,#FFF6D8,#FFE7B8);border:2px solid #FFE0A0}
.rw-jar .big{font-size:64px;line-height:1}
.rw-jar .n{font-family:var(--display);font-size:40px;font-weight:800;line-height:1}
.rw-jar small{color:var(--muted);font-weight:700;font-size:14px}
.chest{display:flex;align-items:center;gap:14px;padding:16px;width:100%;text-align:start;background:linear-gradient(135deg,var(--purple),#A07BFF);color:#fff;border:0}
.chest .ic{font-size:52px;line-height:1;transition:transform .3s}
.chest.open .ic{transform:scale(1.15) rotate(-8deg)}
.chest b{font-family:var(--display);font-size:22px;display:block;line-height:1.1}
.chest small{font-weight:700;opacity:.9}
.chest:disabled{opacity:.75}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (min-width:700px){.shop{grid-template-columns:repeat(6,1fr)}}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;text-align:center;border:3px solid transparent;position:relative}
.item .ic{font-size:44px;line-height:1.1}
.item b{font-size:15px;font-weight:800;line-height:1.15}
.item small{font-size:12.5px;font-weight:800;color:var(--muted)}
.item.lock .ic{filter:grayscale(1);opacity:.35}
.item.lock::after{content:"🔒";position:absolute;top:8px;inset-inline-end:8px;font-size:16px}
.item.on{border-color:var(--green);background:var(--green-l)}
.item.on small{color:var(--green-d)}
#hAv,.pAv{position:relative}
#hAv[data-acc]::after,.pAv[data-acc]::after{content:attr(data-acc);position:absolute;top:-14px;inset-inline-end:-10px;font-size:.62em;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
</style>
</head>

/* =============== VOICE =============== */
function say(text,auto){
  if(!('speechSynthesis' in window)){if(!auto)toast(t('toasts').voice);return}
  speechSynthesis.cancel();
  const code=lang==='en'?'en':lang;
  const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(code));
  if(!v&&lang!=='en'){if(!auto)toast(t('toasts').voice);return}
  const u=new SpeechSynthesisUtterance(text.replace(/[^\p{L}\p{N}\s.,!?؟،'«»]/gu,''));
  if(v)u.voice=v;u.lang=v?v.lang:'en-GB';u.rate=.9;u.pitch=1.1;speechSynthesis.speak(u);
}

const rnd=n=>Math.floor(Math.random()*n),shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const SHAPES=['<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#F0508A"/></svg>','<svg viewBox="0 0 64 64"><path d="M32 4 L60 58 H4 Z" fill="#FFC83D"/></svg>','<svg viewBox="0 0 64 64"><rect x="6" y="6" width="52" height="52" rx="6" fill="#2463EB"/></svg>','<svg viewBox="0 0 64 64"><path d="M32 3 L40 23 L62 24 L45 38 L51 60 L32 47 L13 60 L19 38 L2 24 L24 23 Z" fill="#22A95B"/></svg>'];
const ITEMS=['🍎','⭐','🎈','🐟','🌸','🧁'];
const EN_L=[['A','🍎'],['B','⚽'],['C','🐱'],['D','🐶'],['F','🐟'],['S','☀️'],['M','🌙'],['H','🏠']];
const FA_L=[['پ','🐱','پشک'],['س','🍎','سیب'],['ک','📖','کتاب'],['گ','🌸','گل'],['م','🐟','ماهی'],['د','🌳','درخت']];
const PS_L=[['پ','🐱','پیشو'],['م','🍎','مڼه'],['ک','📖','کتاب'],['ګ','🌸','ګل'],['س','🐶','سپی'],['و','🌳','ونه']];
const EN_W=[['🐱','cat'],['🐶','dog'],['☀️','sun'],['🍎','apple'],['🏠','house'],['🐟','fish'],['📖','book'],['🌳','tree']];
const ANIMALS=['🐶','🐱','🐰','🐘','🐢','🐦','🐟','🐄'],PLANTS=['🌻','🌳','🌵','🌷','🍀'],THINGS=['🚗','⚽','✏️','🎈','🪑','👟'];
const META={count:['cMaths','subCount','count'],shape:['cMaths','subShape','count'],phonics:['cPhon','subPhon','phonics'],nature:['cSci','subNature','nature'],enword:['cLang','subEn','lang'],dari:['cLang','subFa','lang'],pashto:['cLang','subPs','lang']};
function makeQs(g){
  const band=+($('#ages .on')?.dataset.age??1),max=band===0?5:band===1?9:12;
  return Array.from({length:5},(_,i)=>{
    if(g==='count'){const n=2+rnd(max-1),o=shuffle([...new Set([n,n+1,Math.max(1,n-1),n+2])]);return{t:g,n,it:i%ITEMS.length,opts:shuffle(o.slice(0,4).includes(n)?o.slice(0,4):[n,...o.slice(0,3)]),ans:n}}
    if(g==='shape'){const k=rnd(4);return{t:g,k,opts:shuffle([0,1,2,3]),ans:k}}
    if(g==='phonics'||g==='dari'||g==='pashto'){const src=g==='phonics'?EN_L:g==='dari'?FA_L:PS_L;const p=shuffle(src).slice(0,3);return{t:'letter',L:p[0][0],w:p[0][2],opts:shuffle(p.map(x=>x[1])),ans:p[0][1],rtl:g!=='phonics'}}
    if(g==='enword'){const p=shuffle(EN_W).slice(0,3);return{t:g,pic:p[0][0],opts:shuffle(p.map(x=>x[1])),ans:p[0][1]}}
    const wa=i%2===0,good=wa?ANIMALS[rnd(ANIMALS.length)]:PLANTS[rnd(PLANTS.length)];
    return{t:'nature',wa,opts:shuffle([good,THINGS[rnd(THINGS.length)],wa?PLANTS[rnd(PLANTS.length)]:ANIMALS[rnd(ANIMALS.length)]]),ans:good};
  });
}
function startGame(g){game=g;last={g};saveProgress();qs=makeQs(g);qi=0;firstTry=0;wrong=false;go('act');renderQ();setTimeout(()=>say($('#qText').textContent,1),350)}

  if(q.t==='count')return t('qCount')(t('objs')[q.it]);

  if(q.t==='letter')return t('qLetter')(q.L);
  if(q.t==='enword')return t('qWord');
  return q.wa?t('qAnimal'):t('qPlant');
}

  let st='';
  if(q.t==='count')st=Array.from({length:q.n},(_,i)=>`<span class="it" style="animation-delay:${i*60}ms">${ITEMS[q.it]}</span>`).join('');
  else if(q.t==='letter')st=`<span class="letter" style="${q.rtl?'font-family:Vazirmatn':''}">${q.L}</span>`;
  else if(q.t==='enword')st=`<span class="word">${q.pic}</span>`;
  else if(q.t==='shape')st=`<span class="word">🔍</span>`;
  else st=`<span class="word">${q.wa?'🐾':'🌿'}</span>`;
  $('#stage').innerHTML=st;
  const o=$('#opts');o.className='opts'+(q.opts.length===3?' three':'');
  o.innerHTML=q.opts.map(x=>`<button class="opt ${q.t==='enword'?'small':''}" data-a="${x}" dir="ltr">${q.t==='shape'?SHAPES[x]:x}</button>`).join('');
  $('#fbk').className='fbk';$('#fbk').textContent='';$('#nextBtn').disabled=true;
}
function answer(b){
  const q=qs[qi];if($('#nextBtn').disabled===false)return;
  if(String(b.dataset.a)===String(q.ans)){
    b.classList.add('ok');const g=t('good');$('#fbk').textContent='✅ '+g[qi%g.length];$('#fbk').className='fbk show good';
    if(q.t==='letter'&&q.w)$('#fbk').textContent+=`  ${q.ans} ${q.w}`;
    if(!wrong)firstTry++;wrong=false;$('#nextBtn').disabled=false;say(g[qi%g.length],1);
  }else{wrong=true;b.classList.remove('no');void b.offsetWidth;b.classList.add('no');$('#fbk').textContent='🤔 '+t('try');$('#fbk').className='fbk show try'}
}
$('#nextBtn').onclick=()=>{qi++;if(qi<qs.length){renderQ();say($('#qText').textContent,1)}else finish()};
function finish(){
  const s=firstTry>=5?3:firstTry>=3?2:1;stars+=s;const sk=META[game][2];SK[sk]++;
  const nb={count:'b0',phonics:'b3',enword:'b3',dari:'b3',pashto:'b3',nature:'b2',read:'b1'}[game]||'b2';earned.add(nb);
  RECENT.unshift({ic:{count:'🔢',shape:'🔷',phonics:'🔤',nature:'🔬',enword:'🗣️',dari:'🗣️',pashto:'🗣️'}[game],c:'c-blue',k:META[game][1],m:5,s});
  showReward(s,nb);
}
function showReward(s,nb){
  $('#rStars').textContent='⭐'.repeat(s);
  const order=[BADGES.find(b=>b[0]===nb),...BADGES.filter(b=>b[0]!==nb)].slice(0,3);
  $('#rBadges').innerHTML=badgeHTML(order);
  renderAll();go('reward');confetti();say(t('great'),1);
}
function confetti(){const c=$('#confetti'),cols=['#F0508A','#2463EB','#FFC83D','#22A95B','#7C4DEB','#FF8A3D'];c.innerHTML=Array.from({length:44},()=>`<i style="left:${rnd(100)}%;background:${cols[rnd(6)]};animation-delay:${Math.random()*.7}s;animation-duration:${2+Math.random()*1.4}s"></i>`).join('');setTimeout(()=>c.innerHTML='',4200)}

/* =============== STORY =============== */
const SCENES=['🐦🌳','🌬️🍃🌳','🐦☁️🏙️','🐦🤝🐿️🏠'];
function renderPage(){$('#scene').textContent=SCENES[page];$('#sent').textContent=t('pages')[page];$('#pDots').innerHTML=SCENES.map((_,i)=>`<i class="${i===page?'on':''}"></i>`).join('');$('#pPrev').style.visibility=page?'visible':'hidden'}
$('#pPrev').onclick=()=>{if(page){page--;renderPage()}};
$('#pNext').onclick=()=>{if(page<SCENES.length-1){page++;renderPage();say(t('pages')[page],1)}else{stars+=2;SK.read++;earned.add('b1');RECENT.unshift({ic:'📖',c:'c-purple',k:'storyTitle',m:3,s:2});game='read';showReward(2,'b1')}};
$('#sayPage').onclick=()=>say(t('pages')[page]);

/* =============== CHAT =============== */
const WHO=[{face:'👩🏽‍🏫',bg:'var(--teal-l)',k:'tSara'},{face:'🧑🏻‍🏫',bg:'var(--green-l)',k:'tAli'}];
function renderChat(){
  const w=WHO[chatWho];$('#cAv').textContent=w.face;$('#cAv').style.background=w.bg;$('#cName').textContent=t(w.k);
  const th=$('#thread'),typing=$('#typing');
  th.innerHTML='';chats[chatWho].forEach(m=>{
    const d=document.createElement('div');d.className='msg '+m.f+(m.voice?' voice':'');
    d.innerHTML=m.voice?`▶ <span class="wave">${[8,14,20,12,18,10,16,8,12].map(h=>`<i style="height:${h}px"></i>`).join('')}</span> 0:0${m.voice}`:'';
    if(!m.voice)d.textContent=msgText(m);
    th.appendChild(d)});
  th.appendChild(typing);
  $('#quick').innerHTML=t('quick').map((q,i)=>`<button data-qr="${i}">${q}</button>`).join('');
  requestAnimationFrame(()=>{const v=$('#v-chat');v.scrollTop=v.scrollHeight});
}
function send(m,replyIdx){
  chats[chatWho].push(m);renderChat();
  $('#typing').classList.add('on');requestAnimationFrame(()=>{const v=$('#v-chat');v.scrollTop=v.scrollHeight});
  setTimeout(()=>{$('#typing').classList.remove('on');chats[chatWho].push(replyIdx===-1?{f:'them',k:'voiceReply'}:{f:'them',r:replyIdx});renderChat();renderAll();say(msgText(chats[chatWho].at(-1)),1)},1400);
}
$('#sendBtn').onclick=()=>{const v=$('#inp').value.trim();if(!v)return;$('#inp').value='';send({f:'me',txt:v},0)};
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter')$('#sendBtn').click()});
let recT=null;
$('#micBtn').onclick=()=>{const b=$('#micBtn');if(recT){clearTimeout(recT);recT=null;b.classList.remove('rec');b.textContent='🎤';send({f:'me',voice:4},-1);return}b.classList.add('rec');b.textContent='⏹';recT=setTimeout(()=>$('#micBtn').click(),3000)};
$('#sayLast').onclick=()=>{const m=chats[chatWho].filter(x=>x.f==='them').at(-1);if(m)say(msgText(m))};

/* =============== VIDEOS =============== */
// Short cartoons shown as a sequence of scenes with captions, standing in for real video files.
const VIDS=[{ic:'🐵',sc:['🐵🍌','🐵🍌🍌','🐵🍌🍌🍌','🐵🎉']},{ic:'🌱',sc:['🌰','🌰💧','🌱☀️','🌻😊']},{ic:'🎵',sc:['🍎','⚽','🐱','🎵🎤']}];
let vid=0,vi=0,vt=null,cc=true,lowData=true;
function renderVids(){
  $('#vidList').innerHTML=VIDS.map((v,i)=>`<button class="card row b-purple" data-vid="${i}"><span class="icb c-purple" style="width:72px;height:72px;font-size:42px">${v.ic}</span><span class="tx"><b>${t('v'+i)}</b><small>▶ ${t('vMeta')}</small></span><span class="chev flip">›</span></button>`).join('');
}
function renderWatch(){
  const v=VIDS[vid];
  $('#wTitle').textContent=t('v'+vid);$('#wScene').textContent=v.sc[vi];
  $('#wCap').textContent=t('v'+vid+'cap')[vi];$('#wCap').style.display=cc?'':'none';
  $('#wBar').style.width=(vi+1)/v.sc.length*100+'%';
  $('#wPlay').textContent=vt?'⏸':'▶';
  $('#wCC').classList.toggle('on',cc);$('#wLow').classList.toggle('on',lowData);
}
function stopVid(){clearInterval(vt);vt=null}
function openVid(i){stopVid();vid=i;vi=0;last={v:i};saveProgress();go('watch');renderWatch()}
function playVid(){
  if(vt){stopVid();renderWatch();return}
  const n=VIDS[vid].sc.length;if(vi>=n-1)vi=0;
  vt=setInterval(()=>{vi++;renderWatch();say(t('v'+vid+'cap')[vi],1);if(vi>=n-1){stopVid();renderWatch();videoDone()}},2600);
  renderWatch();say(t('v'+vid+'cap')[vi],1);
}
function videoDone(){stars++;SK.read++;RECENT.unshift({ic:VIDS[vid].ic,c:'c-purple',k:'v'+vid,m:3,s:1});renderAll();toast(t('vDone'))}

/* =============== CONTINUE + RECOMMENDED =============== */
const GIC={count:'🔢',shape:'🔷',phonics:'🔤',nature:'🔬',enword:'🗣️',dari:'🗣️',pashto:'🗣️'};
const REC=[[{g:'count'},{g:'phonics'},{v:0}],[{g:'enword'},{go:'story'},{v:1}],[{g:'shape'},{g:'nature'},{v:2}]];
function actInfo(a){
  if(a.v!==undefined)return{ic:VIDS[a.v].ic,k:'v'+a.v,attr:`data-vid="${a.v}"`};
  if(a.go==='story')return{ic:'📖',k:'storyTitle',attr:'data-go="story"'};
  return{ic:GIC[a.g],k:META[a.g][1],attr:`data-game="${a.g}"`};
}
function renderCont(){
  const a=actInfo(last);
  $('#cont').innerHTML=`<button class="card row b-green" ${a.attr}><span class="icb c-green">${a.ic}</span><span class="tx"><b>${t('contL')}</b><small>${t(a.k)} · ${t('pickUp')}</small></span><span class="chev flip">▶</span></button>`;
}
function renderRecs(){
  const band=kid.age<=6?0:kid.age<=9?1:2;
  $('#recs').innerHTML=REC[band].map(r=>{const a=actInfo(r);return `<button class="card rc" ${a.attr}><span class="ic">${a.ic}</span><b>${t(a.k)}</b><small>${t('year')} ${kid.yr}</small></button>`}).join('');
}

/* =============== SAVED PROGRESS =============== */
// Each child's progress is kept in this browser, so it is still there after closing the app.
// The real app keeps it on the device and syncs it to the UK database.
const SAVE_KEY='hlb-kids-progress-v1';
const START={stars,SK:{...SK},earned:[...earned],recent:RECENT.map(r=>({...r})),acc:null,last:{g:'count'}};
function saveProgress(){
  try{const all=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');all[kid.name]={stars,SK:{...SK},earned:[...earned],recent:RECENT.slice(0,8),acc:kid.acc||null,last};localStorage.setItem(SAVE_KEY,JSON.stringify(all))}catch(e){}
}
function loadProgress(k){
  let s=null;try{s=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')[k.name]}catch(e){}
  s=s||START;
  stars=s.stars;Object.keys(SK).forEach(x=>SK[x]=s.SK[x]??0);
  earned.clear();s.earned.forEach(b=>earned.add(b));
  RECENT.length=0;s.recent.forEach(r=>RECENT.push({...r}));
  k.acc=s.acc||null;last=s.last||{g:'count'};
}

/* =============== CLICKS =============== */
document.addEventListener('click',e=>{
  const el=e.target.closest('button');if(!el)return;const d=el.dataset;
  if(d.lang){lang=d.lang;applyLang();return}
  if(el.id==='langBtn'){lang={en:'fa',fa:'ps',ps:'en'}[lang];applyLang();toast({en:'English',fa:'دری',ps:'پښتو'}[lang]);return}
  if(d.kid!==undefined){saveProgress();kid=KIDS[+d.kid];loadProgress(kid);const band=kid.age<=6?0:kid.age<=9?1:2;$$('#ages button').forEach(b=>b.classList.toggle('on',+b.dataset.age===band));seedChat();renderAll();hist=[];go('home');return}
  if(d.age!==undefined){$$('#ages button').forEach(b=>b.classList.toggle('on',b===el));return}
  if(d.chip){chip=d.chip;renderChips();renderCourses();return}
  if(d.game){startGame(d.game);return}
  if(d.vid!==undefined){openVid(+d.vid);return}
  if(el.id==='wPlay'){playVid();return}
  if(el.id==='wCC'){cc=!cc;renderWatch();return}
  if(el.id==='wLow'){lowData=!lowData;renderWatch();return}
  if(el.id==='sayCap'){say(t('v'+vid+'cap')[vi]);return}
  if(d.quick!==undefined){chatWho=0;go('chat');setTimeout(()=>send({f:'me',q:+d.quick},+d.quick),250);return}
  if(d.qr!==undefined){send({f:'me',q:+d.qr},+d.qr);return}
  if(d.who!==undefined){chatWho=+d.who;go('chat');if(d.rec)setTimeout(()=>$('#micBtn').click(),300);return}
  if(d.go){go(d.go);return}
  if(d.say){say(t(d.say));return}
  if(d.toast){toast(t('toasts')[d.toast]);return}
  if(d.rw!==undefined){const [k,,need]=REWARDS[+d.rw];if(stars<need){toast(t('moreStars')(need-stars));return}kid.acc=kid.acc===k?null:k;renderAll();return}
  if(el.id==='chest'){if(chestOpened)return;chestOpened=true;stars++;renderAll();confetti();say(t('chestDone'),1);toast(t('chestDone'));return}
  if(d.feel!==undefined){const m=$('#feelMsg');m.textContent=t('feelA')[+d.feel];m.style.opacity=1;say(t('feelA')[+d.feel],1);return}
  if(d.step!==undefined){const i=+d.step;stepsDone=stepsDone.includes(i)?stepsDone.filter(x=>x!==i):[...stepsDone,i];renderSteps();return}
  if(el.classList.contains('opt')){answer(el);return}
  if(el.id==='sayQ'){say($('#qText').textContent);return}
  if(el.id==='againBtn'){if(game==='read')go('read');else startGame(game);return}
});
loadProgress(kid);seedChat();applyLang();
if('speechSynthesis' in window)speechSynthesis.getVoices();
</script>
</body>
</html>
